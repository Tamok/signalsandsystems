name: Accessibility audit (advisory)

# Runs pa11y-ci + Lighthouse CI against the built site.
# Currently advisory: findings are reported but do not block the merge.
# Flip `continue-on-error` to false after M9 to make this a required gate.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  a11y:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for puppeteer
        # pnpm v10 blocks postinstalls by default; rebuild triggers
        # puppeteer's install.mjs which downloads Chrome to ~/.cache/puppeteer.
        run: pnpm rebuild puppeteer

      - name: Build site
        run: pnpm build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run pa11y audit (light + dark)
        # pnpm a11y runs scripts/a11y-audit.mjs which boots http-server,
        # then audits each URL twice (prefers-color-scheme seeded via
        # localStorage) so both themes are covered.
        run: pnpm a11y

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report.json
          if-no-files-found: ignore

      - name: Serve built site for Lighthouse
        run: |
          npx http-server dist -p 4321 --silent &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4321 > /dev/null; then break; fi
            sleep 1
          done

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:4321/ \
            --collect.url=http://localhost:4321/articles \
            --collect.url=http://localhost:4321/resources \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:accessibility=\"[\\\"error\\\", {\\\"minScore\\\": 0.95}]\" \
            --assert.assertions.categories:performance=\"[\\\"error\\\", {\\\"minScore\\\": 0.90}]\"
